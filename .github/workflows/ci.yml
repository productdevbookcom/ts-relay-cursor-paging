name: Main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: 📚 Main
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v6

      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Build
        run: pnpm build

      - name: 👀 Lint
        run: pnpm lint

      # - name: 🧪 Test
      #   run: pnpm test
      #   env:
      #     VITE_TEST_DB_URL: ${{ secrets.VITE_TEST_DB_URL }}

      - name: 🧪 Test with coverage
        run: pnpm coverage
        env:
          VITE_TEST_DB_URL: ${{ secrets.VITE_TEST_DB_URL }}

      - name: 📝 Upload coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
